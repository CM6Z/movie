<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影搜索下载器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .movie-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .movie-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .movie-item.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .movie-info h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .movie-info p {
            color: #666;
            font-size: 14px;
        }

        .download-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .progress-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-info { color: #17a2b8; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-error { color: #dc3545; }

        .hidden {
            display: none;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .movie-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 电影搜索下载器</h1>
            <p>搜索并下载您喜欢的电影</p>
        </div>

        <div class="search-container">
            <div class="search-form">
                <input type="text" class="search-input" id="searchInput" placeholder="请输入电影名称..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" id="searchBtn" onclick="searchMovies()">🔍 搜索</button>
            </div>
            <div id="statusMessage"></div>
        </div>

        <div class="results-container hidden" id="resultsContainer">
            <h2>搜索结果</h2>
            <div id="movieList"></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <h2>下载进度</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备下载...</div>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <script>
        class MovieSearchEngine {
            constructor() {
                this.baseUrl = 'https://www.xiaobaotv.com';
                this.userAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36';
                this.proxyUrls = [
                    'https://api.allorigins.win/raw?url=',
                    'https://corsproxy.io/?',
                    'https://cors-anywhere.herokuapp.com/',
                    'https://thingproxy.freeboard.io/fetch/'
                ];
                this.currentProxyIndex = 0;
            }

            async fetchWithProxy(url, options = {}) {
                for (let i = 0; i < this.proxyUrls.length; i++) {
                    const proxyIndex = (this.currentProxyIndex + i) % this.proxyUrls.length;
                    const proxyUrl = this.proxyUrls[proxyIndex];
                    
                    try {
                        this.log(`尝试代理 ${proxyIndex + 1}: ${proxyUrl.split('/')[2]}`, 'info');
                        
                        let fetchUrl;
                        const requestOptions = {
                            method: 'GET',
                            headers: {
                                'User-Agent': this.userAgent,
                                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                                'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                                'Cache-Control': 'no-cache',
                                ...options.headers
                            },
                            ...options
                        };

                        if (proxyUrl.includes('allorigins.win')) {
                            fetchUrl = `${proxyUrl}${encodeURIComponent(url)}`;
                        } else if (proxyUrl.includes('corsproxy.io')) {
                            fetchUrl = `${proxyUrl}${encodeURIComponent(url)}`;
                        } else {
                            fetchUrl = proxyUrl + url;
                        }

                        const response = await fetch(fetchUrl, requestOptions);
                        
                        if (response.ok) {
                            this.currentProxyIndex = proxyIndex;
                            return response;
                        } else {
                            this.log(`代理 ${proxyIndex + 1} 响应错误: ${response.status}`, 'warning');
                        }
                    } catch (error) {
                        this.log(`代理 ${proxyIndex + 1} 失败: ${error.message}`, 'warning');
                    }
                }
                
                throw new Error('所有代理都失败了');
            }

            async searchMovies(keyword) {
                try {
                    this.showStatus('正在搜索电影...', 'info');
                    
                    const encodedKeyword = encodeURIComponent(keyword);
                    const searchUrl = `${this.baseUrl}/search.html?wd=${encodedKeyword}&submit=`;
                    
                    const response = await this.fetchWithProxy(searchUrl, {
                        headers: {
                            'Referer': this.baseUrl + '/'
                        }
                    });
                    
                    const html = await response.text();
                    const movies = this.parseSearchResults(html, encodedKeyword);
                    return movies;
                } catch (error) {
                    console.error('搜索失败:', error);
                    this.showStatus(`搜索失败: ${error.message}`, 'error');
                    return [];
                }
            }

            parseSearchResults(html, encodedKeyword) {
                const movies = [];
                const seenIds = new Set();
                
                // 匹配电影条目
                const itemPattern = /<li[^>]*class="[^"]*clearfix[^"]*"[^>]*>(.*?)<\/li>/gs;
                const itemMatches = html.match(itemPattern) || [];
                
                for (const item of itemMatches) {
                    const idMatch = item.match(/\/vod\/(?:detail|play)\/(\d+)/);
                    if (!idMatch || seenIds.has(idMatch[1])) continue;
                    
                    const videoId = idMatch[1];
                    seenIds.add(videoId);
                    
                    let title = this.extractTitle(item, videoId);
                    
                    movies.push({
                        id: videoId,
                        title: title,
                        playUrl: `/vod/play/${videoId}-1-1.html`,
                        searchReferer: `${this.baseUrl}/search.html?wd=${encodedKeyword}&submit=`
                    });
                }
                
                return movies;
            }

            extractTitle(itemHtml, videoId) {
                // 尝试从searchkey链接提取标题
                const searchkeyPattern = new RegExp(`<a[^>]*class="searchkey"[^>]*href="[^"]*${videoId}[^"]*"[^>]*>(.*?)</a>`, 's');
                let match = itemHtml.match(searchkeyPattern);
                
                if (match) {
                    let title = match[1].replace(/<[^>]+>/g, '').trim();
                    if (title.length > 1) return title;
                }
                
                // 尝试其他标题模式
                const titlePatterns = [
                    /<h4[^>]*class="[^"]*title[^"]*"[^>]*>(.*?)<\/h4>/s,
                    /title="([^"]+)"/,
                    /alt="([^"]+)"/
                ];
                
                for (const pattern of titlePatterns) {
                    match = itemHtml.match(pattern);
                    if (match) {
                        let title = match[1].replace(/<[^>]+>/g, '').trim();
                        if (title.length > 1) return title;
                    }
                }
                
                return `电影ID_${videoId}`;
            }

            async getVideoUrl(movieInfo) {
                try {
                    const playUrl = this.baseUrl + movieInfo.playUrl;
                    const response = await this.fetchWithProxy(playUrl, {
                        headers: {
                            'Referer': movieInfo.searchReferer
                        }
                    });
                    
                    const html = await response.text();
                    
                    const patterns = [
                        /"url":\s*"([^"]+\.m3u8[^"]*)"/,
                        /"link":\s*"([^"]+\.m3u8[^"]*)"/,
                        /"link_next":\s*"([^"]+\.m3u8[^"]*)"/,
                        /src\s*:\s*"([^"]+\.m3u8[^"]*)"/,
                        /var\s+player_aaaa\s*=\s*{[^}]*"url":\s*"([^"]+)"/
                    ];
                    
                    for (const pattern of patterns) {
                        const match = html.match(pattern);
                        if (match) {
                            const videoUrl = match[1].replace(/\\\//g, '/');
                            return { videoUrl, playUrl };
                        }
                    }
                    
                    return null;
                } catch (error) {
                    console.error('获取视频URL失败:', error);
                    return null;
                }
            }

            async downloadM3U8Video(videoUrl, playUrl, filename) {
                try {
                    this.showProgress();
                    this.log('开始分析M3U8文件...', 'info');
                    
                    // 获取M3U8文件
                    const response = await this.fetchWithProxy(videoUrl, {
                        headers: {
                            'Referer': playUrl
                        }
                    });
                    
                    let m3u8Content = await response.text();
                    
                    // 检查是否是主播放列表
                    if (m3u8Content.includes('#EXT-X-STREAM-INF')) {
                        this.log('检测到主播放列表，获取实际视频流...', 'info');
                        const lines = m3u8Content.split('\n');
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed && !trimmed.startsWith('#')) {
                                const actualUrl = trimmed.startsWith('http') ? 
                                    trimmed : 
                                    videoUrl.substring(0, videoUrl.lastIndexOf('/') + 1) + trimmed;
                                
                                const actualResponse = await this.fetchWithProxy(actualUrl, {
                                    headers: {
                                        'Referer': videoUrl
                                    }
                                });
                                m3u8Content = await actualResponse.text();
                                videoUrl = actualUrl;
                                break;
                            }
                        }
                    }
                    
                    // 解析视频片段
                    const baseUrl = videoUrl.substring(0, videoUrl.lastIndexOf('/') + 1);
                    const segmentUrls = [];
                    
                    const lines = m3u8Content.split('\n');
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed && !trimmed.startsWith('#')) {
                            const segmentUrl = trimmed.startsWith('http') ? 
                                trimmed : 
                                baseUrl + trimmed;
                            segmentUrls.push(segmentUrl);
                        }
                    }
                    
                    if (segmentUrls.length === 0) {
                        this.log('未找到视频片段', 'error');
                        return false;
                    }
                    
                    this.log(`找到 ${segmentUrls.length} 个视频片段`, 'success');
                    
                    // 下载所有片段
                    const chunks = [];
                    let totalSize = 0;
                    let successCount = 0;
                    
                    for (let i = 0; i < segmentUrls.length; i++) {
                        try {
                            this.log(`下载片段 ${i + 1}/${segmentUrls.length}`, 'info');
                            this.updateProgress((i / segmentUrls.length) * 100);
                            
                            const segmentResponse = await this.fetchWithProxy(segmentUrls[i], {
                                headers: {
                                    'Referer': videoUrl
                                }
                            });
                            
                            const arrayBuffer = await segmentResponse.arrayBuffer();
                            
                            chunks.push(new Uint8Array(arrayBuffer));
                            totalSize += arrayBuffer.byteLength;
                            successCount++;
                            
                            // 添加延时避免请求过快
                            if (i < segmentUrls.length - 1) {
                                await this.sleep(Math.random() * 1500 + 800);
                            }
                        } catch (error) {
                            this.log(`片段 ${i + 1} 下载失败: ${error.message}`, 'warning');
                            // 添加空片段占位，保持同步
                            chunks.push(new Uint8Array(0));
                        }
                    }
                    
                    this.log(`下载完成: ${successCount}/${segmentUrls.length} 个片段`, 'success');
                    
                    if (successCount === 0) {
                        this.log('没有成功下载任何片段', 'error');
                        return false;
                    }
                    
                    // 合并所有片段
                    this.log('合并视频片段...', 'info');
                    const mergedData = new Uint8Array(totalSize);
                    let offset = 0;
                    
                    for (const chunk of chunks) {
                        if (chunk.length > 0) {
                            mergedData.set(chunk, offset);
                            offset += chunk.length;
                        }
                    }
                    
                    // 创建下载链接
                    const blob = new Blob([mergedData.slice(0, offset)], { type: 'video/mp2t' });
                    const url = URL.createObjectURL(blob);
                    
                    // 触发下载
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename.replace('.mp4', '.ts'); // 使用TS格式
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    this.updateProgress(100);
                    this.log(`下载完成！文件大小: ${(offset/1024/1024).toFixed(2)}MB`, 'success');
                    this.showStatus('下载完成！文件已保存到下载文件夹。', 'success');
                    
                    return true;
                } catch (error) {
                    this.log(`下载失败: ${error.message}`, 'error');
                    this.showStatus(`下载失败: ${error.message}`, 'error');
                    return false;
                }
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            showStatus(message, type) {
                const statusEl = document.getElementById('statusMessage');
                statusEl.innerHTML = `<div class="status-message status-${type}">${message}</div>`;
            }

            showProgress() {
                document.getElementById('progressContainer').style.display = 'block';
                document.getElementById('logContainer').innerHTML = '';
            }

            updateProgress(percentage) {
                document.getElementById('progressFill').style.width = `${percentage}%`;
                document.getElementById('progressText').textContent = `${Math.round(percentage)}%`;
            }

            log(message, type = 'info') {
                const logContainer = document.getElementById('logContainer');
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        // 全局实例
        const movieEngine = new MovieSearchEngine();
        let currentMovies = [];

        async function searchMovies() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                movieEngine.showStatus('请输入电影名称', 'error');
                return;
            }

            const searchBtn = document.getElementById('searchBtn');
            searchBtn.disabled = true;
            searchBtn.textContent = '搜索中...';

            try {
                const movies = await movieEngine.searchMovies(keyword);
                currentMovies = movies;
                displayMovies(movies);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 搜索';
            }
        }

        function displayMovies(movies) {
            const container = document.getElementById('resultsContainer');
            const movieList = document.getElementById('movieList');
            
            if (!movies || movies.length === 0) {
                movieEngine.showStatus('没有找到相关电影', 'error');
                container.classList.add('hidden');
                return;
            }

            movieList.innerHTML = '';
            movies.forEach((movie, index) => {
                const movieDiv = document.createElement('div');
                movieDiv.className = 'movie-item';
                movieDiv.innerHTML = `
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <p>ID: ${movie.id}</p>
                    </div>
                    <button class="download-btn" onclick="downloadMovie(${index})">
                        📥 下载
                    </button>
                `;
                movieList.appendChild(movieDiv);
            });

            container.classList.remove('hidden');
            movieEngine.showStatus(`找到 ${movies.length} 个结果`, 'success');
        }

        async function downloadMovie(index) {
            const movie = currentMovies[index];
            if (!movie) return;

            const videoInfo = await movieEngine.getVideoUrl(movie);
            if (!videoInfo) {
                movieEngine.showStatus('无法获取视频地址', 'error');
                return;
            }

            const safeTitle = movie.title.replace(/[^\w\s-]/g, '').trim().replace(/[-\s]+/g, '-');
            const filename = `${safeTitle}_${movie.id}.mp4`;

            await movieEngine.downloadM3U8Video(videoInfo.videoUrl, videoInfo.playUrl, filename);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchMovies();
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            movieEngine.showStatus('请输入电影名称进行搜索', 'info');
        });
    </script>
</body>
</html>
